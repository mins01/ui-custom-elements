<!doctype html>
<html lang="ko" >
<head>
    <title>ui-custom-elements/multi-form-control</title>
    <meta charset="utf-8">
    <meta http-equiv="Content-Script-Type" content="text/javascript">
    <meta http-equiv="Content-Style-Type" content="text/css">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="shortcut icon" href="http://www.mins01.com/favicon.ico"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="/js/ForGoogle.js"></script>
    <!-- google analytics -->
    <script>if(window.ForGoogle){ ForGoogle.analytics() }else{ console.log("failure : ForGoogle.analytics()");}</script>
    

    <!-- jquery 관련 -->
    <!-- <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js" integrity="sha256-kmHvs0B+OpCW5GVHUNjv9rOmY0IvSIRcf7zGUDTDQM8=" crossorigin="anonymous"></script> -->

    <!-- 부트스트랩 5.3.x -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- vue.js -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/vue"></script> -->
    
    <!-- meta og -->
    
    <meta property="og:title" content="ui-custom-elements/multi-form-control">
    <meta property="og:description" content="ui-custom-elements/multi-form-control">
    <meta property="og:image" content="http://www.mins01.com/img/logo.gif">
    <meta property="og:image:width" content="190">
    <meta property="og:image:height" content="70" />
    <meta property="og:site_name" content="ui-custom-elements/multi-form-control" />
    <meta property="og:type" content="website">
    
    <!-- //meta og -->
     <script type="module">
        import MultiFormControl from './MultiFormControl.js';
        // MultiFormControl.shadowRootHtml += '<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">';
        MultiFormControl.define();
        import MultiFormControlWrapper from './MultiFormControlWrapper.js';
        MultiFormControlWrapper.define();

     </script>
    
    <style>
        multi-form-control::part(slot-form-field){
            font-size: 40px;
        }
        multi-form-control.multi-max::part(form-field){
            color: blue;
            background-color: #abc;

            border-radius: 2em;
            padding:4px;
            font-size: 20px;;
        }
    </style>
    <style>
        multi-form-control-wrapper .multi-form-wrap{
            display: flex;
            gap:4px;
            flex-wrap: wrap;
        }
        multi-form-control-wrapper .form-control{
            field-sizing: content;
            min-width: 6em;
            width:auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ui-custom-elements/multi-form-control</h1>
        <div class="card my-1">
            <div class="card-header">multi-form-control</div>
            <div class="card-body">
                <form action="" onsubmit="console.table([...new FormData(this).entries()].map(([key, value]) => ({
                        key,
                        value
                        })));return false;">
                    <h3>multi</h3>
                    <multi-form-control name="multi"></multi-form-control>
                    <h3>multi-required</h3>
                    <multi-form-control name="multi-required" required="true"></multi-form-control>
                    <h3>multi-max</h3>
                    <multi-form-control class="multi-max" name="multi-max" max="4"></multi-form-control>
                    <h3>multi-input-attr</h3>
                    <multi-form-control class="multi-input-attr" name="multi-input-attr" >
                        <template slot="slot-template">
                            <input class="form-field" type="text" part="form-field"  maxlength="5">
                        </template>
                    </multi-form-control>
                    <h3>multi-slot</h3>
                    <multi-form-control name="multi-slot">
                        <template slot="slot-template">
                            <select class="form-field" part="form-field slot-form-field">
                                <option value="">선택하세요</option>
                                <option value="apple">사과</option>
                                <option value="banana">바나나</option>
                            </select>
                        </template>
                    </multi-form-control>
                    <h3>multi-value</h3>
                    <multi-form-control name="multi-value" value="text1,1234,ABCD,한글"></multi-form-control>
                    <h3>multi-bootstrap (style not work)</h3>
                    <multi-form-control name="multi-bootstrap" max="4">
                        <template slot="slot-template">
                            <input type="text" class="form-control form-control-lg" part="form-field">
                        </template>
                    </multi-form-control>
                    <hr>
                    <button>전송</button>
                </form>
            </div>
        </div>
        <div class="card my-1">
            <div class="card-header">multi-form-control-wrapper</div>
            <div class="card-body">
                <form action="" onsubmit="console.table([...new FormData(this).entries()].map(([key, value]) => ({
                        key,
                        value
                        })));return false;">
                    <h3>multi-empty</h3>
                    <multi-form-control-wrapper name="multi-empty" max="4">
                    </multi-form-control-wrapper>
                    <h3>multi-bootstrap(max="4")</h3>
                    <multi-form-control-wrapper name="multi-bootstrap" max="4">
                        <template>
                            <input type="text" class="form-control form-control-lg">
                        </template>
                    </multi-form-control-wrapper>
                    <h3>multi-value</h3>
                    <multi-form-control-wrapper name="multi-value" value="text1,1234,ABCD,한글">
                        <template>
                            <input type="text" class="form-control form-control-lg">
                        </template>
                    </multi-form-control-wrapper>
                    <hr>
                    <button>전송</button>
                </form>
            </div>
        </div>
        
    </div>
</body>
</html>
